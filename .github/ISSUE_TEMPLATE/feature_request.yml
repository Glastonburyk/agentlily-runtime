name: Feature Request
description: Propose a new runtime capability or extension point
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What contributor or product need does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the change and affected modules
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope Boundaries
      description: What should remain intentionally unfinished?
